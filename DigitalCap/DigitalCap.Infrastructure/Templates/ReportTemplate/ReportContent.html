<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 11px;
            margin: 0;
            padding: 20px;
            color: #1a1a1a;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            border-bottom: 2px solid #1a2e5a;
            padding-bottom: 6px;
            margin-bottom: 16px;
            color: #1a2e5a;
        }

        .part-badge {
            display: inline-block;
            background: #1a2e5a;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 3px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .section-meta {
            font-size: 10px;
            color: #666;
            margin-bottom: 18px;
        }

        .grading-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 11px;
        }

            .grading-table thead tr {
                background-color: #1a2e5a;
                color: #ffffff;
            }

            .grading-table thead th {
                padding: 8px 10px;
                text-align: center;
                font-weight: bold;
                border: 1px solid #1a2e5a;
                min-width: 50px;
            }

                .grading-table thead th:first-child {
                    text-align: left;
                    min-width: 160px;
                }

                .grading-table thead th:nth-child(2) {
                    min-width: 180px;
                    text-align: left;
                }

            .grading-table tbody tr {
                border-bottom: 1px solid #e0e0e0;
            }

                .grading-table tbody tr:nth-child(even) {
                    background-color: #f8f9fc;
                }

            .grading-table tbody td {
                padding: 7px 10px;
                border: 1px solid #ddd;
                vertical-align: middle;
            }

                .grading-table tbody td:first-child {
                    font-weight: bold;
                    color: #1a2e5a;
                    background-color: #f0f3fa;
                }

        .grading-value-cell {
            font-style: italic;
            color: #444;
        }

        .grade-check {
            text-align: center;
            font-size: 14px;
        }

            .grade-check.checked {
                color: #1a2e5a;
                font-weight: bold;
            }

            .grade-check.unchecked {
                color: #ccc;
            }

        .notes-section {
            margin-bottom: 20px;
        }

        .notes-label {
            font-weight: bold;
            font-size: 12px;
            color: #1a2e5a;
            margin-bottom: 8px;
            border-left: 4px solid #1a2e5a;
            padding-left: 8px;
        }

        .notes-box {
            border: 1px solid #ccc;
            border-radius: 4px;
            padding: 10px 12px;
            min-height: 60px;
            background: #fafafa;
            font-size: 11px;
            line-height: 1.6;
            color: #333;
        }

        .divider {
            border: none;
            border-top: 1px solid #ddd;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="section-meta">
        <span class="part-badge">PART {{PART_NAME}}</span>
        Section {{SECTION_INDEX}} of {{SECTION_TOTAL}}
    </div>

    <div class="section-title">{{SECTION_LABEL}}</div>

    <div class="section-title" style="font-size:12px; border-bottom: 1px solid #ccc; color:#333;">
        Select Grades
    </div>

    <table class="grading-table">
        <thead>
            <tr>
                <th style="text-align:left;"> </th>
                <th style="text-align:left;">Grading</th>
                {{GRADING_OPTION_HEADERS}}
            </tr>
        </thead>
        <tbody>
            {{GRADING_ROWS}}
        </tbody>
    </table>

    <div class="notes-section">
        <div class="notes-label">Notes</div>
        <div class="notes-box">{{NOTES_CONTENT}}</div>
    </div>

</body>
</html>
