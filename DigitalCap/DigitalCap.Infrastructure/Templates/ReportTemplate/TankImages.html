<!DOCTYPE html>
<html>
<head>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 11px;
            margin: 0;
            padding: 20px;
            color: #1a1a1a;
        }

        .section-title {
            font-size: 14px;
            font-weight: bold;
            border-bottom: 2px solid #1a2e5a;
            padding-bottom: 6px;
            margin-bottom: 16px;
            color: #1a2e5a;
        }

        .part-badge {
            display: inline-block;
            background: #1a2e5a;
            color: #ffffff;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 10px;
            border-radius: 3px;
            margin-right: 8px;
            vertical-align: middle;
        }

        .section-meta {
            font-size: 10px;
            color: #666;
            margin-bottom: 18px;
        }

        .image-grid {
            width: 100%;
            border-collapse: separate;
            border-spacing: 12px;
            margin-bottom: 20px;
        }

            .image-grid td {
                width: 50%;
                vertical-align: top;
                padding: 0;
            }

        .tank-card {
            border: 2px solid #4caf50; 
            border-radius: 6px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,0.10);
            page-break-inside: avoid;
        }

            .tank-card .image-area {
                width: 100%;
                height: 200px;
                overflow: hidden;
                background: #f0f3fa;
                display: flex;
                align-items: center;
                justify-content: center;
            }

                .tank-card .image-area img {
                    width: 100%;
                    height: 100%;
                    object-fit: cover;
                    display: block;
                }

        .tank-footer {
            background: #f8f9fc;
            border-top: 1px solid #e0e0e0;
            padding: 8px 12px;
        }

        .tank-id {
            font-weight: bold;
            font-size: 12px;
            color: #1a2e5a;
            display: block;
            margin-bottom: 4px;
        }

        .tank-meta-row {
            display: table;
            width: 100%;
        }

        .tank-meta-cell {
            display: table-cell;
            vertical-align: top;
            font-size: 10px;
            color: #555;
        }

            .tank-meta-cell:last-child {
                text-align: right;
            }

        .meta-label {
            font-weight: bold;
            color: #1a2e5a;
        }

        .condition-badge {
            display: inline-block;
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
            border-radius: 3px;
            padding: 1px 7px;
            font-size: 10px;
            font-weight: bold;
            margin-top: 2px;
        }

        .description-text {
            color: #444;
            font-size: 10px;
            margin-top: 4px;
            line-height: 1.5;
        }

        .tank-card-empty {
            border: none;
            box-shadow: none;
            background: transparent;
        }

        .upload-summary {
            background: #f0f3fa;
            border: 1px solid #c5cfe8;
            border-radius: 5px;
            padding: 8px 14px;
            margin-bottom: 16px;
            font-size: 11px;
            color: #1a2e5a;
        }

            .upload-summary strong {
                font-size: 13px;
            }
    </style>
</head>
<body>

    <div class="section-meta">
        <span class="part-badge">PART {{PART_NAME}}</span>
        Section {{SECTION_INDEX}} of {{SECTION_TOTAL}}
    </div>

    <div class="section-title">{{SECTION_LABEL}} — Tank Images</div>

    <div class="upload-summary">
        Images uploaded: <strong>{{UPLOADED_COUNT}}</strong> / {{TOTAL_COUNT}}
    </div>

    <table class="image-grid">
        {{TANK_IMAGE_ROWS}}
    </table>

</body>
</html>
